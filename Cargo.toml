[package]
name = "vikey-engine"
version = "2.0.0"
edition = "2021"
description = "ViKey - Bộ gõ tiếng Việt (Telex/VNI) cho IBus, viết bằng Rust"
license = "GPL-3.0"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
tokio = { version = "1", features = ["macros", "rt", "time", "signal"] }
serde_json = "1"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = "1"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
